version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql://databound:password@db:5432/databound
      - JWT_SECRET_KEY=your-secret-key
    volumes:
      - ./backend:/app/backend
    depends_on:
      - db
    networks:
      - databound-network

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    volumes:
      - ./frontend:/app/frontend
    depends_on:
      - backend
    networks:
      - databound-network

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=databound
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=databound
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - databound-network

volumes:
  postgres_data:

networks:
  databound-network:
    driver: bridge
