# render.yaml — Render Blueprint for DataBound AI
#
# This defines the whole stack as code: a managed Postgres instance, the
# FastAPI backend as a Docker web service, and the React frontend as a
# static site. Render reads this file when you create a "Blueprint" from
# your repo and provisions all three together.
#
# Docs: https://render.com/docs/blueprint-spec

databases:
  - name: databound-postgres
    databaseName: databound
    user: databound
    plan: free
    # pgvector is available as an extension on Render Postgres; it gets
    # enabled with `CREATE EXTENSION vector;` once Phase 4 needs it.

services:
  # --- Backend: FastAPI, built from backend/Dockerfile ---
  - type: web
    name: databound-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: databound-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # CORS_ORIGINS is set after the frontend's URL is known — see
      # deployment steps in README.md. Comma-separated is fine, e.g.:
      #   https://databound-frontend.onrender.com
      - key: CORS_ORIGINS
        value: http://localhost:5173
      # REQUIRED for Chat (POST /api/questions) to generate answers, as of
      # Phase 5. Render will prompt for this value when applying the
      # Blueprint since sync: false means it's not stored in the repo —
      # get a key at console.anthropic.com. Retrieval/search works fine
      # without it.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-sonnet-4-6
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_PROVIDER
        value: local
      - key: EMBEDDING_DIMENSIONS
        value: "384"
      - key: CHUNK_SIZE
        value: "800"
      - key: CHUNK_OVERLAP
        value: "100"
      - key: TOP_K
        value: "5"
      - key: SIMILARITY_THRESHOLD
        value: "0.3"
      - key: MAX_FILE_SIZE
        value: "20971520"

  # --- Frontend: static build served by Render's CDN ---
  - type: web
    name: databound-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Baked into the build at build time (Vite inlines import.meta.env.*),
      # so this must point at the backend's Render URL, not localhost.
      # Update it once you know the backend's actual URL — see README.md.
      - key: VITE_API_BASE_URL
        value: https://databound-backend.onrender.com
    routes:
      # SPA fallback: React Router handles client-side paths like /documents,
      # so any unmatched path should still serve index.html.
      - type: rewrite
        source: /*
        destination: /index.html
