services:
  # PostgreSQL Database
  - type: pserv
    name: databound-db
    plan: free
    ipAllowList: []
    postgresSQLVersion: "16"
    databaseName: databound_db
    databaseUser: databound
    preStartCommand: ""
    region: oregon

  # Backend API Service
  - type: web
    name: databound-backend
    plan: free
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: oregon
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: databound-db
          property: connectionString
      - key: LLM_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_MODEL
        value: gpt-4
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: TOP_K
        value: "5"
      - key: SIMILARITY_THRESHOLD
        value: "0.5"
      - key: MAX_FILE_SIZE
        value: "52428800"
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /api/health
    domains:
      - key: API_URL
    headers:
      - path: /api/*
        name: Access-Control-Allow-Origin
        value: "*"
    depends_on:
      - databound-db

  # Frontend Service
  - type: web
    name: databound-frontend
    plan: free
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: oregon
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: VITE_API_URL
        fromService:
          name: databound-backend
          type: web
          property: url
    healthCheckPath: /
    domains:
      - key: APP_URL
    depends_on:
      - databound-backend
